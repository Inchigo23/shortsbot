name: ShortsBot

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (repositorio público: minutos gratis ilimitados)
  workflow_dispatch:
    inputs:
      accion:
        description: "ciclo, producir, subir_siguiente, subir:<id> o estadisticas"
        required: false
        default: "ciclo"

permissions:
  contents: write

concurrency:
  group: shortsbot
  cancel-in-progress: false

env:
  TZ: Europe/Madrid
  PYTHONIOENCODING: utf-8
  IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
  TIENE_YOUTUBE: ${{ secrets.YOUTUBE_TOKEN != '' }}

jobs:
  shortsbot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: ⚙️ Descargar el código
        uses: actions/checkout@v4

      - name: ⚙️ Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-nube.txt

      - name: ⚙️ Librerías básicas
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib requests tzdata

      - name: 🗓️ Planificador
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCION: ${{ inputs.accion || 'ciclo' }}
        run: python nube.py plan

      - name: ⚙️ Preparar el estudio
        if: steps.plan.outputs.producir == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          pip install -q -r requirements-nube.txt

      - name: ⚙️ Voces (guardadas de otras veces)
        if: steps.plan.outputs.producir == 'true'
        uses: actions/cache@v4
        with:
          path: datos/voces
          key: voces-kokoro-davefx-v1

      - name: ⚙️ Descargar las voces si faltan
        if: steps.plan.outputs.producir == 'true'
        run: |
          mkdir -p datos/voces && cd datos/voces
          K=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          P=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          [ -f kokoro-v1.0.int8.onnx ] || curl -sSfL -o kokoro-v1.0.int8.onnx $K/kokoro-v1.0.int8.onnx
          [ -f voices-v1.0.bin ] || curl -sSfL -o voices-v1.0.bin $K/voices-v1.0.bin
          [ -f es_ES-davefx-medium.onnx ] || curl -sSfL -o es_ES-davefx-medium.onnx $P/es_ES-davefx-medium.onnx
          [ -f es_ES-davefx-medium.onnx.json ] || curl -sSfL -o es_ES-davefx-medium.onnx.json $P/es_ES-davefx-medium.onnx.json

      - name: ✍️ Guionista
        if: steps.plan.outputs.producir == 'true'
        env:
          GUION: ${{ steps.plan.outputs.guion }}
        run: python nube.py guion

      - name: 🎙️ Narrador
        if: steps.plan.outputs.producir == 'true'
        run: python nube.py voz

      - name: 🧱 Animador
        if: steps.plan.outputs.producir == 'true'
        env:
          ANIMACION_ESCALA: "0.6667"
          ANIMACION_MSAA: "0"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python nube.py animar

      - name: 🎬 Montador
        if: steps.plan.outputs.producir == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python nube.py montar

      - name: 🚀 Mensajero
        if: steps.plan.outputs.subir != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          SUBIR: ${{ steps.plan.outputs.subir }}
        run: python nube.py subir

      - name: 📊 Estadista
        if: steps.plan.outputs.estadisticas == 'true'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python nube.py estadisticas

      - name: 💾 Guardar
        if: always()
        run: |
          git config user.name "ShortsBot"
          git config user.email "shortsbot@users.noreply.github.com"
          git add nube/
          if ! git diff --cached --quiet; then
            git commit -qm "ShortsBot: $(date '+%d/%m %H:%M')"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
